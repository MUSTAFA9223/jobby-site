# One Cloudflare Worker for the JOBBY website, static game and multiplayer API.
name = "jobby"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

routes = [
  { pattern = "jobby.lol", custom_domain = true },
  { pattern = "www.jobby.lol", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/world/*", "/world/models/JOBBY.glb"]
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "WORLD_ROOM"
class_name = "WorldRoom"

[[migrations]]
tag = "world-rooms-v1"
new_sqlite_classes = ["WorldRoom"]

[previews]

# Preview rooms use an isolated namespace within the same Cloudflare Worker.
[[previews.durable_objects.bindings]]
name = "WORLD_ROOM"
class_name = "WorldRoom"

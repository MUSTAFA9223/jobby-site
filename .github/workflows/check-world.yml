name: JOBBY WORLD checks
on:
  push:
    branches:
      - feature/world-coop-rooms
      - feature/world-voice-walls
      - feature/world-12-echo
      - feature/big-house-escape
  pull_request:
    paths:
      - 'worker.js'
      - 'player-store.js'
      - 'warehouse-room.js'
      - 'race-room.js'
      - 'challenge-room.js'
      - 'party-room.js'
      - 'owner-setup.js'
      - 'wrangler.toml'
      - 'public/world/**'
      - 'tests/**'
      - '.github/workflows/check-world.yml'
permissions:
  contents: read
jobs:
  verify-world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out game source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build and scene-test tooling
        run: npm install --no-audit --no-fund
      - name: Test private co-op room state
        run: node --test tests/*.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check party-room.js
          node --check public/world/party-game.js
          node --check public/world/party-rules.js
          node --check public/world/party-scene.js
          node --check public/world/party-replay.js
          node --check challenge-room.js
          node --check race-room.js
          node --check public/world/race-rules.js
          node --check public/world/race-scene.js
          node --check public/world/race-game.js
          node --check warehouse-room.js
          node --check public/world/warehouse-layout.js
          node --check public/world/warehouse-rules.js
          node --check public/world/warehouse-scene.js
          node --check public/world/warehouse-game.js
          node --check public/world/warehouse-plan.js
          node --check player-store.js
          node --check public/world/player-profile.js
          node --check worker.js
          node --check public/world/main.js
          node --check public/world/hub.js
          node --check public/world/rooms.js
          node --check public/world/multiplayer.js
          node --check public/world/avatar-cache.js
          node --check public/world/house-layout.js
          node --check public/world/house-scene.js
          node --check public/world/house-game.js
          node --check public/world/house-plan.js
          node --check public/world/voice.js
          node --check public/world/voice-capture.js
          node --check public/world/voice-protocol.js
          node --check public/world/camera-occlusion.js
      - name: Build Cloudflare Worker without deployment
        run: npx wrangler deploy --dry-run --outdir .build/world
      - name: Test real WebSocket voice relay with twelve clients
        run: node tests/world-voice-runtime.mjs .build/world/worker.js

      - name: Test persistent player profiles and leaderboard
        run: node tests/world-players-runtime.mjs .build/world/worker.js

      - name: Test warehouse puzzles and saved co-op rewards with twelve players
        run: node tests/world-warehouse-runtime.mjs .build/world/worker.js

      - name: Test obstacle racing with twelve real clients and saved individual finishes
        run: node tests/world-race-runtime.mjs .build/world/worker.js

      - name: Test team challenges, entry points and isolated rankings
        run: node tests/world-challenge-runtime.mjs .build/world/worker.js

      - name: Test crown heist, cursed treasure, signals and full team payout
        run: node tests/world-party-runtime.mjs .build/world/worker.js
